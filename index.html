<body>
  <style>
    /* Standalone, instant-start branding. Keeps fallback available without app JS. */
    #syl-startup-fallback{position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(ellipse 305px 250px at 50% 42%,rgba(211,23,45,.125),transparent 76%),radial-gradient(ellipse 220px 190px at 53% 46%,rgba(185,197,212,.035),transparent 80%),#080c13;color:#f2f7ff;font:500 14px/1.55 'DM Sans',sans-serif;text-align:center;overflow:hidden}
    #syl-startup-fallback .syl-startup-grid{position:absolute;inset:0;pointer-events:none;opacity:.42;background-image:linear-gradient(rgba(76,120,161,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(76,120,161,.075) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:radial-gradient(ellipse 46% 43% at 50% 50%,#000,transparent);mask-image:radial-gradient(ellipse 46% 43% at 50% 50%,#000,transparent)}
    #syl-startup-fallback .syl-startup-inner{position:relative;z-index:1;width:min(335px,100%);min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
    #syl-startup-fallback .syl-startup-halo{position:relative;display:grid;place-items:center;width:146px;height:146px;margin-bottom:14px}
    #syl-startup-fallback .syl-startup-halo:before{content:"";position:absolute;inset:2px;border-radius:50%;background:conic-gradient(from 18deg,rgba(252,47,64,.19),rgba(255,124,137,.33),transparent 56%,rgba(228,239,248,.12),rgba(252,47,64,.2));filter:blur(18px);animation:sylStartupGlow 3.7s ease-in-out infinite}
    #syl-startup-fallback .syl-startup-halo:after{content:"";position:absolute;inset:9px;border-radius:33px;border:1px solid rgba(235,65,77,.3);background:linear-gradient(135deg,rgba(26,29,39,.65),rgba(8,12,19,.65));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 40px rgba(0,0,0,.22);transform:rotate(-3deg)}
    #syl-startup-fallback .syl-startup-logo{position:relative;z-index:2;display:block;width:114px;height:114px;object-fit:contain;filter:drop-shadow(0 9px 15px rgba(0,0,0,.35));animation:sylStartupMark 3.5s ease-in-out infinite}
    #syl-startup-fallback .syl-startup-wordmark{display:flex;flex-direction:column;align-items:center;gap:5px}
    #syl-startup-fallback h1{font:850 31px/1.16 'Plus Jakarta Sans','DM Sans',sans-serif;letter-spacing:-.06em;margin:0;color:#f5f8ff}
    #syl-startup-fallback h1 span{color:#ff5668}
    #syl-startup-fallback .syl-startup-subtitle{font-size:9px;font-weight:850;line-height:1.5;letter-spacing:.23em;color:#acb9ce;margin:0;text-transform:uppercase}
    #syl-startup-fallback .syl-startup-message{margin:32px 0 12px!important;color:#d5e1ef!important;font-size:12px;line-height:1.5;font-weight:650}
    #syl-startup-fallback .syl-startup-line{position:relative;width:176px;height:3px;border-radius:99px;overflow:hidden;background:#243245;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
    #syl-startup-fallback .syl-startup-line span{position:absolute;display:block;width:36%;height:100%;border-radius:99px;background:linear-gradient(90deg,#e31a33,#ff6676,#f4f7ff);box-shadow:0 0 14px rgba(252,60,85,.45);animation:sylStartupLoad 1.8s ease-in-out infinite}
    #syl-startup-fallback .syl-startup-motto{font-size:9px;font-weight:750;letter-spacing:.19em;color:#97a7bc;margin:25px 0 0!important}
    #syl-startup-fallback .syl-startup-repair-copy{max-width:280px;color:#9fb0c5;margin:10px 0 12px!important;font-size:12px}
    #syl-startup-fallback button{min-height:45px;margin-top:7px;padding:0 21px;border:1px solid rgba(255,115,160,.48);border-radius:12px;background:linear-gradient(112deg,#ec334b,#ae1a36);color:white;font:800 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 9px 23px rgba(241,48,103,.17)}
    #syl-startup-fallback button:focus-visible{outline:3px solid #4edfe9;outline-offset:3px}
    #syl-startup-fallback[data-failed="true"] .syl-startup-halo{width:110px;height:110px;margin-bottom:13px}
    #syl-startup-fallback[data-failed="true"] .syl-startup-logo{width:86px;height:86px;animation:none}
    #syl-startup-fallback[data-failed="true"] .syl-startup-message{display:none}
    @keyframes sylStartupMark{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes sylStartupGlow{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
    @keyframes sylStartupLoad{0%{left:-37%}50%{left:47%}100%{left:101%}}
    @media(prefers-reduced-motion:reduce){#syl-startup-fallback .syl-startup-logo,#syl-startup-fallback .syl-startup-halo:before,#syl-startup-fallback .syl-startup-line span{animation:none!important}#syl-startup-fallback .syl-startup-line span{left:30%!important;width:40%!important}}
  </style>
  <div id="app"><div id="syl-startup-fallback" role="status" aria-label="Opening SYLearn">
    <div class="syl-startup-grid" aria-hidden="true"></div>
    <div class="syl-startup-inner">
      <div class="syl-startup-halo"><img class="syl-startup-logo" src="./sylearn-brand.svg" alt="SYLearn logo"/></div>
      <div class="syl-startup-wordmark"><h1>SY<span>Learn</span></h1><p class="syl-startup-subtitle">Digital Skills Academy</p></div>
      <p class="syl-startup-message">Preparing your learning space</p>
      <div class="syl-startup-line" aria-hidden="true"><span></span></div>
      <p class="syl-startup-motto">LEARN · BUILD · GROW</p>
    </div>
  </div></div>
  <script>
    (function(){
      const element=()=>document.getElementById('syl-startup-fallback');
      function showRecovery(){
        const root=element();if(!root||root.dataset.failed)return;
        root.dataset.failed='true';
        root.querySelector('.syl-startup-inner').innerHTML=
          '<div class="syl-startup-halo"><img class="syl-startup-logo" src="./sylearn-brand.svg" alt="SYLearn logo"/></div>'+
          '<h1>Could not open <span>SYLearn</span></h1>'+
          '<p class="syl-startup-repair-copy">The academy did not finish loading. Your saved learning records will not be deleted.</p>'+
          '<button type="button" id="syl-startup-retry">Repair &amp; reopen</button>';
      }
      window.addEventListener('error',function(e){
        if(element()&&(e.target===window||e.target?.tagName==='SCRIPT'))showRecovery();
      },true);
      window.addEventListener('unhandledrejection',function(){if(element())showRecovery()});
      window.addEventListener('DOMContentLoaded',function(){
        window.setTimeout(function(){if(element())showRecovery()},8000);
      });
      document.addEventListener('click',async function(e){
        if(e.target?.id!=='syl-startup-retry')return;
        e.target.disabled=true;e.target.textContent='Reopening…';
        try{
          if('serviceWorker' in navigator){
            const regs=await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.filter(r=>r.scope.startsWith(location.origin+'/')).map(r=>r.unregister()));
          }
          if('caches' in window){
            const keys=await caches.keys();
            await Promise.all(keys.filter(k=>/^(sylution-learn|sylution-video|sylution-courses)/.test(k)).map(k=>caches.delete(k)));
          }
        }catch(err){}
        location.reload();
      });
    })();
  </script>

  <script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    const key="sylution-learn-controller-20261027officiallogov2";
    if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,"1");location.reload()}
  });
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?release=20261027officiallogov2",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{}));
}
</script>
